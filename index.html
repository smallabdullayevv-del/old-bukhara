<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinor Milliy Taomlar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            gold: '#FFB800',
                            goldDark: '#D48800',
                            goldLight: '#FFD54F',
                            neonBlue: '#00D2FF',
                            darkBg: '#0c0a06',
                            glassCard: 'rgba(22, 18, 12, 0.75)',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0c0a06;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 184, 0, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(0, 210, 255, 0.1) 0%, transparent 65%),
                linear-gradient(to bottom, rgba(12, 10, 6, 0.78), rgba(12, 10, 6, 0.92)),
                url('https://iili.io/Cs1Ht3J.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Эффект стекла с золотистой рамкой */
        .glass-panel {
            background: rgba(22, 18, 12, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 184, 0, 0.25);
        }

        .glass-panel-hover:hover {
            background: rgba(32, 26, 17, 0.85);
            border-color: rgba(255, 184, 0, 0.6);
            box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 184, 0, 0.3);
        }

        /* Свечение */
        .glow-gold {
            box-shadow: 0 0 30px rgba(255, 184, 0, 0.4);
        }

        .glow-avatar {
            box-shadow: 0 0 40px rgba(255, 184, 0, 0.4), inset 0 0 20px rgba(255, 184, 0, 0.2);
        }

        .glow-text {
            text-shadow: 0 0 12px rgba(255, 184, 0, 0.7);
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #120e08;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB800;
            border-radius: 9999px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-full text-white flex flex-col justify-between items-center min-h-screen p-4 sm:p-6 overflow-x-hidden selection:bg-amber-500 selection:text-black">

    <!-- Верхняя панель переключения языков -->
    <header class="w-full pt-2 sm:pt-4 flex justify-center items-center z-10">
        <div class="inline-flex items-center glass-panel p-1.5 rounded-full shadow-2xl shadow-amber-950/40">
            <button onclick="setLanguage('uz')" id="lang-uz" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold text-gray-300 hover:text-white transition-all duration-300">
                <span class="text-[10px] bg-white/10 px-1.5 py-0.5 rounded font-black tracking-wider uppercase">UZ</span> UZ
            </button>
            <button onclick="setLanguage('ru')" id="lang-ru" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-xs sm:text-sm font-extrabold transition-all duration-300 bg-gradient-to-r from-[#FFB800] to-amber-600 text-black shadow-lg shadow-amber-500/30">
                <span class="text-[10px] bg-black/25 px-1.5 py-0.5 rounded font-black tracking-wider uppercase text-white">RU</span> RU
            </button>
            <button onclick="setLanguage('eng')" id="lang-eng" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold text-gray-300 hover:text-white transition-all duration-300">
                <span class="text-[10px] bg-white/10 px-1.5 py-0.5 rounded font-black tracking-wider uppercase">GB</span> ENG
            </button>
        </div>
    </header>

    <!-- Главный блок -->
    <main class="w-full max-w-md my-auto flex flex-col items-center text-center space-y-7 z-10 py-6">
        
        <!-- Логотип -->
        <div onclick="openMenu()" class="relative group cursor-pointer">
            <div class="absolute -inset-2 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 rounded-full blur-xl opacity-60 group-hover:opacity-90 transition duration-500 animate-pulse"></div>
            
            <div class="relative w-44 h-44 sm:w-52 sm:h-52 rounded-full border-4 border-[#FFB800] p-1 bg-[#0c0a06]/90 flex items-center justify-center glow-avatar overflow-hidden">
                <img src="https://iili.io/Cs1u8mP.jpg" alt="Chinor Logo" class="w-full h-full object-cover rounded-full shadow-inner" onerror="this.src='https://placehold.co/200x200/FFB800/000000?text=Chinor'">
            </div>
        </div>

        <!-- Название и подзаголовок -->
        <div class="space-y-2.5">
            <h1 class="text-3xl sm:text-4xl font-black tracking-widest text-white uppercase drop-shadow-md">
                Old House
            </h1>
            <div class="flex items-center justify-center gap-3 text-[#FFB800]">
                <span class="h-[2px] w-8 sm:w-12 bg-gradient-to-r from-transparent to-[#FFB800]"></span>
                <p id="txt-subtitle" class="text-xs sm:text-sm font-extrabold tracking-[0.25em] uppercase text-amber-400 glow-text">
                    РЕСТОРАН
                </p>
                <span class="h-[2px] w-8 sm:w-12 bg-gradient-to-l from-transparent to-[#FFB800]"></span>
            </div>
        </div>

        <!-- Кнопка вызова меню разделов -->
        <button onclick="openMenu()" class="w-full glass-panel glass-panel-hover rounded-2xl p-4 sm:p-4.5 flex items-center justify-between shadow-2xl cursor-pointer transform hover:-translate-y-1 transition-all duration-300 border-l-4 border-l-[#FFB800] group block text-left">
            <div class="flex items-center gap-4">
                <!-- Иконка категории -->
                <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-[#FFB800] group-hover:bg-[#FFB800] group-hover:text-black group-hover:shadow-lg group-hover:shadow-amber-500/40 transition-all duration-300">
                    <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </div>
                <!-- Заголовок -->
                <div>
                    <p id="txt-card-top" class="text-[10px] sm:text-xs font-bold text-amber-400/90 tracking-widest uppercase">
                        ГЛАВНОЕ МЕНЮ
                    </p>
                    <h2 id="txt-card-title" class="text-base sm:text-lg font-black text-white leading-tight">
                        Разделы меню
                    </h2>
                </div>
            </div>
            <!-- Стрелка -->
            <div class="text-gray-400 group-hover:text-[#FFB800] group-hover:translate-x-1.5 transition-all duration-300 pr-1">
                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                </svg>
            </div>
        </button>

    </main>

    <!-- Подвал -->
    <footer class="w-full text-center pb-4 pt-2 z-10 space-y-1">
        <p id="txt-footer-main" class="text-xs sm:text-sm font-bold text-gray-300 tracking-[0.2em] sm:tracking-[0.25em] uppercase">
            ВАШЕ ЛЮБИМОЕ МЕСТО
        </p>
        <p class="text-[10px] sm:text-xs font-semibold text-amber-500/80 tracking-[0.25em] uppercase">
            PREMIUM QUALITY SINCE 2024
        </p>
        <p class="pt-1">
            <a href="https://t.me/smldsgn" target="_blank" rel="noopener noreferrer" class="text-[10px] text-gray-400 hover:text-amber-400 transition-colors duration-200 tracking-wider font-medium opacity-75 hover:opacity-100">
                by sml.dsgn
            </a>
        </p>
    </footer>

    <!-- Модальное окно с разделами -->
    <div id="menuModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 opacity-0 pointer-events-none transition-all duration-300 flex justify-center items-end sm:items-center p-0 sm:p-4">
        <div class="bg-[#120e08]/95 border border-amber-500/30 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[88vh] flex flex-col shadow-2xl shadow-amber-950/60 overflow-hidden transform translate-y-8 transition-transform duration-300" id="modalContainer">
            
            <!-- Шапка модального окна -->
            <div class="p-4 sm:p-5 border-b border-gray-800/80 flex items-center justify-between bg-[#18130b]/90">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#FFB800]/20 border border-[#FFB800] flex items-center justify-center text-[#FFB800] shadow-md shadow-amber-500/20">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <div>
                        <h3 id="modal-title" class="font-extrabold text-white text-lg">Разделы Меню</h3>
                        <p id="modal-subtitle" class="text-xs text-amber-400/80 font-medium">Выберите интересующий раздел</p>
                    </div>
                </div>
                <button onclick="closeMenu()" class="w-9 h-9 rounded-full bg-gray-800/80 text-gray-400 hover:text-white hover:bg-amber-600 transition-all duration-200 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Список разделов со ссылками -->
            <div class="p-4 overflow-y-auto space-y-3 flex-1" id="categoriesList">
                <!-- Список динамически формируется из JS -->
            </div>

            <!-- Подвал модального окна -->
            <div class="p-4 border-t border-gray-800/80 bg-[#18130b]/90 flex items-center justify-between text-xs text-gray-300 font-medium">
                <span><i class="fa-solid fa-phone text-[#FFB800] mr-1.5"></i> +998 90 712 44 11
</span>
                <span><i class=""></i></span>
            </div>
        </div>
    </div>

    <script>
        // Переводы интерфейса
        const translations = {
            uz: {
                subtitle: "RESTAURANT",
                cardTop: "ASOSIY MENU",
                cardTitle: "Menyu Bo'limlari",
                footerMain: "SIZNING SEVIMLI MASKANINGIZ",
                modalTitle: "Menyu Bo'limlari",
                modalSub: "Kerakli bo'limni tanlang"
            },
            ru: {
                subtitle: "РЕСТОРАН",
                cardTop: "ГЛАВНОЕ МЕНЮ",
                cardTitle: "Разделы меню",
                footerMain: "ВАШЕ ЛЮБИМОЕ МЕСТО",
                modalTitle: "Разделы Меню",
                modalSub: "Выберите интересующий раздел"
            },
            eng: {
                subtitle: "RESTAURANT",
                cardTop: "MAIN MENU",
                cardTitle: "Menu Categories",
                footerMain: "YOUR FAVORITE PLACE",
                modalTitle: "Menu Categories",
                modalSub: "Select a category to view"
            }
        };

        // Разделы меню и ссылки для каждого раздела
        const menuCategories = [
            {
                id: "salad",
                name: { ru: "Салаты", uz: "Salatlar", eng: "Salads" },
                desc: { ru: "Свежие и фирменные салаты", uz: "Taza va masalliqli salatlar", eng: "Fresh & signature salads" },
                icon: "fa-leaf",
                // Укажите требуемую ссылку для разделов
                url: "https://drive.google.com/file/d/12W1Bwd5QmY_gRmu0uN0BJ8NyFfA8TbN-/view?usp=sharing"
            },
            {
                id: "cold_appetizers",
                name: { ru: "Холодные закуски", uz: "Sovuq gazaklar", eng: "Cold Appetizers" },
                desc: { ru: "Мясное ассорти, сыры и соления", uz: "Go'sht va pishloq assortilari", eng: "Meat & cheese platters, pickles" },
                icon: "fa-snowflake",
                url: "https://drive.google.com/file/d/1bcbiU3yhiz5x4OQTERUw1sLH1jODuhVQ/view?usp=sharing"
            },
            {
                id: "hot_appetizers",
                name: { ru: "Горячие закуски", uz: "Issiq gazaklar", eng: "Hot Appetizers" },
                desc: { ru: "Аппетитные горячие блюда", uz: "Issiq va mazali gazaklar", eng: "Delicious warm starters" },
                icon: "fa-fire-burner",
                url: "https://drive.google.com/file/d/1zafd-2jhDfK0HdgrHnNNSUS5lWFnQExv/view?usp=sharing"
            },
            {
                id: "soups",
                name: { ru: "Супы", uz: "Sho'rvalar", eng: "Soups" },
                desc: { ru: "Наваристые и ароматные супы", uz: "Xushbo'y va mazali sho'rvalar", eng: "Rich and flavorful soups" },
                icon: "fa-bowl-food",
                url: "https://drive.google.com/file/d/1pLhmmxNrSCoW_0BkOaJDXSBKalEEnye1/view?usp=sharing"
            },
            {
                id: "beef_dishes",
                name: { ru: "Блюда из говядины", uz: "Mol go'shtidan taomlar", eng: "Beef Dishes" },
                desc: { ru: "Сочное мясо и традиционные блюда", uz: "Shirali mol go'shtidan taomlar", eng: "Juicy beef & traditional specialties" },
                icon: "fa-drumstick-bite",
                url: "https://drive.google.com/file/d/1QoC0QZrEea557tDI-jAFrKRnvlsOpYWk/view?usp=sharing"
            },
            {
                id: "garnishes",
                name: { ru: "Гарниры", uz: "Garnirlar", eng: "Garnishes" },
                desc: { ru: "Картофель, рис, овощи на гриле", uz: "Kartoshka, guruch, sabzavotlar", eng: "Potatoes, rice & grilled vegetables" },
                icon: "fa-bowl-rice",
                url: "https://drive.google.com/file/d/1wq2Tvxej6rBzSF8msLOVKkQ7txsGWp6-/view?usp=sharing"
            },
            {
                id: "desserts",
                name: { ru: "Десерты", uz: "Shirinliklar", eng: "Desserts" },
                desc: { ru: "Сладкие блюда и выпечка", uz: "Shirinliklar va pishiriqlar", eng: "Sweets, cakes & pastries" },
                icon: "fa-cookie-bite",
                url: "https://drive.google.com/file/d/1b9-xTb42tLdTs0hLn-mFgRH-XslNWEDq/view?usp=sharing"
            }
        ];

        let currentLang = 'ru';

        // Переключение языка
        function setLanguage(lang) {
            currentLang = lang;
            
            ['uz', 'ru', 'eng'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (l === lang) {
                    btn.className = "flex items-center gap-1.5 px-4 py-2 rounded-full text-xs sm:text-sm font-extrabold transition-all duration-300 bg-gradient-to-r from-[#FFB800] to-amber-600 text-black shadow-lg shadow-amber-500/30";
                } else {
                    btn.className = "flex items-center gap-1.5 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold text-gray-300 hover:text-white transition-all duration-300";
                }
            });

            document.getElementById('txt-subtitle').innerText = translations[lang].subtitle;
            document.getElementById('txt-card-top').innerText = translations[lang].cardTop;
            document.getElementById('txt-card-title').innerText = translations[lang].cardTitle;
            document.getElementById('txt-footer-main').innerText = translations[lang].footerMain;
            document.getElementById('modal-title').innerText = translations[lang].modalTitle;
            document.getElementById('modal-subtitle').innerText = translations[lang].modalSub;

            renderCategories();
        }

        // Рендеринг списка разделов
        function renderCategories() {
            const container = document.getElementById('categoriesList');
            container.innerHTML = '';

            menuCategories.forEach(cat => {
                const linkCard = document.createElement('a');
                linkCard.href = cat.url;
                linkCard.target = "_blank";
                linkCard.className = "bg-[#1d170e]/80 hover:bg-[#261f14] border border-gray-800/80 hover:border-amber-500/50 rounded-2xl p-4 flex items-center justify-between transition-all duration-300 shadow-md group cursor-pointer transform hover:-translate-y-0.5";
                
                linkCard.innerHTML = `
                    <div class="flex items-center gap-3.5">
                        <div class="w-11 h-11 rounded-xl bg-[#FFB800]/15 border border-[#FFB800]/30 flex items-center justify-center text-[#FFB800] group-hover:bg-[#FFB800] group-hover:text-black group-hover:shadow-md group-hover:shadow-amber-500/30 transition-all duration-300 flex-shrink-0">
                            <i class="fa-solid ${cat.icon} text-lg"></i>
                        </div>
                        <div class="text-left">
                            <h4 class="font-bold text-white text-base leading-tight group-hover:text-amber-400 transition-colors">${cat.name[currentLang]}</h4>
                            <p class="text-xs text-gray-400 mt-1">${cat.desc[currentLang]}</p>
                        </div>
                    </div>
                    <div class="text-amber-400 opacity-70 group-hover:opacity-100 group-hover:translate-x-1 transition-all duration-300 flex-shrink-0 pl-2">
                        <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                    </div>
                `;
                container.appendChild(linkCard);
            });
        }

        // Открытие модального окна
        function openMenu() {
            renderCategories();
            const modal = document.getElementById('menuModal');
            const container = document.getElementById('modalContainer');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.remove('translate-y-8');
        }

        // Закрытие модального окна
        function closeMenu() {
            const modal = document.getElementById('menuModal');
            const container = document.getElementById('modalContainer');
            modal.classList.add('opacity-0', 'pointer-events-none');
            container.classList.add('translate-y-8');
        }

        // Закрытие при клике на затемненный фон
        document.getElementById('menuModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeMenu();
            }
        });

        // Инициализация при загрузке
        window.onload = function() {
            setLanguage('ru');
        };
    </script>
</body>
</html>
